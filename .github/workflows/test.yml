name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: pytest -q
      # The sample has two payouts that need attention, so the script exits 1 by design.
      - run: |
          python reconcile.py sample/stripe_itemized.csv sample/bank.csv --out out || test $? -eq 1
          test -s out/report.md && test -s out/journal.csv
